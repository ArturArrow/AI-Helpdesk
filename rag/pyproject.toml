[project]
name = "rag"
version = "0.0.0"
description = "Document store and vector search behind the helpdesk's AI replies"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
