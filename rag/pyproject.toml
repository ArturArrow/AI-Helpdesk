[project]
name = "rag"
version = "0.0.0"
description = "Document store and vector search behind the helpdesk's AI replies"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "langchain-openai>=1.7.4",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "psycopg[binary]>=3.3.8",
    "pypdf>=6.21.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]
